name: SIS CI

on:
  push:
    branches:
      - master
      - develop

  pull_request:
    branches:
      - master
      - develop

jobs:
  build:
    name: Build and Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v6

      - name: Setup Java 8
        uses: actions/setup-java@v6
        with:
          java-version: '8'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Make gradle wrapper executable
        run : chmod +x ./gradlew

      - name: Build and test
        run: ./gradlew clean build

      - name: Upload JAR
        if: success()
        uses: actions/upload-artifact@v7
        with:
          name: sis-application
          path: build/libs/*.jar
